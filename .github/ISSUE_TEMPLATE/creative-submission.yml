name: "🎨 Creative Showcase Submission"
description: "Submit a UI/UX design, photography series, video aftermovie, or 3D artwork to FOSS Studio"
title: "[Showcase]: "
labels: ["showcase-submission", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ### FOSS RIT Creative Studio Submission
        Submissions are reviewed by club maintainers and published to [fossrit.in/studio](https://fossrit.in/studio).

  - type: dropdown
    id: category
    attributes:
      label: "Craft Category"
      description: "Select the primary creative medium that best represents your work."
      options:
        - "design"
        - "photography"
        - "video"
        - "3d"
    validations:
      required: true

  - type: input
    id: author_name
    attributes:
      label: "Your Full Name"
      description: "Your official name to be credited as the creator on the website and contributor leaderboard."
      placeholder: "e.g., Ananya S"
    validations:
      required: true

  - type: input
    id: college_id
    attributes:
      label: "College Roll No. / KTU ID (Student Verification)"
      description: "Used by club leads to verify active campus student status for the verified maker badge. (This is private and never published publicly)."
      placeholder: "e.g., RIT22CS045"
    validations:
      required: true

  - type: input
    id: batch
    attributes:
      label: "Graduation Batch"
      description: "Your expected year of graduation."
      placeholder: "e.g., 2026, 2027, 2028"
    validations:
      required: true

  - type: input
    id: department
    attributes:
      label: "Department / Branch"
      description: "Your college academic branch or school."
      placeholder: "e.g., CSE, ECE, ME, CE, EEE, B.Arch, MCA"
    validations:
      required: true

  - type: input
    id: tools
    attributes:
      label: "Creative Tools Used"
      description: "List the open source or creative tools used, separated by commas."
      placeholder: "e.g., Penpot, Inkscape / Blender, DaVinci Resolve / Sony A7 III"
    validations:
      required: true

  - type: input
    id: media_url
    attributes:
      label: "Media / Preview URL"
      description: "Direct link to view or play your work (YouTube video, Penpot/Figma public view link, or Unsplash/Imgur photo link)."
      placeholder: "e.g., https://youtu.be/... / https://design.penpot.app/... / https://unsplash.com/..."
    validations:
      required: true

  - type: input
    id: thumbnail_url
    attributes:
      label: "Custom Cover / Thumbnail URL (Optional)"
      description: "Optional direct image URL for the showcase cover art. (YouTube videos auto-extract their own high-res thumbnail)."
      placeholder: "e.g., https://images.unsplash.com/... (16:9 recommended)"
    validations:
      required: false

  - type: dropdown
    id: aspect_ratio
    attributes:
      label: "Display Aspect Ratio"
      description: "Recommended frame ratio for the gallery card: 16:9 (video/UI), 3:2 (photography), or 1:1 (square art)."
      options:
        - "16:9"
        - "3:2"
        - "1:1"
    validations:
      required: true

  - type: dropdown
    id: license
    attributes:
      label: "Creative Commons License"
      description: |
        Choose how others can share or use your work:
        • CC-BY-4.0 (Recommended): Anyone can share/remix your work, as long as they give credit to you.
        • CC-BY-SA-4.0: Anyone can remix your work, but their version must also use the same license and credit you.
        • CC0-1.0 (Public Domain): No copyright reserved; open for anyone to use freely without attribution.
      options:
        - "CC-BY-4.0"
        - "CC-BY-SA-4.0"
        - "CC0-1.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Short Description"
      description: "Briefly explain what you created, the tools/process used, or the story behind it (1–3 sentences)."
      placeholder: "A brief 1-2 sentence description explaining your work and the tools/process used."
    validations:
      required: true
